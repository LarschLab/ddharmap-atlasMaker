[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-atlas-preprocess"
version = "0.1.0"
description = "Desktop preprocessing app for orienting brain imaging stacks before registration."
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.11",
  "tifffile>=2024.0",
  "pynrrd>=1.0",
  "PySide6>=6.7",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "SimpleITK>=2.5",
]

[project.scripts]
brain-atlas-preprocess = "brain_atlas_preprocess.app:main"

[tool.setuptools.packages.find]
include = ["brain_atlas_preprocess*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
